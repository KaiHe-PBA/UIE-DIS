data:
  root: ./data/paired_uie
  patch_size: 256
  center_crop_eval: false

model:
  base_dim: 32
  enc_blocks: [1, 1, 2, 2]
  dec_blocks: [1, 1, 1, 1]
  time_emb_dim: 256
  time_mlp_dim: 512
  use_residual_head: true
  use_gate_in_film: true

loss:
  w_recon: 1.0
  w_ssim: 0.2
  w_color: 0.02
  w_edge: 0.0
  w_freq: 0.0
  use_charbonnier: true

train:
  seed: 42
  epochs: 150
  batch_size: 4
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  grad_clip: 1.0
  log_interval: 20
  save_dir: ./checkpoints/student_supervised

  warmup_epochs: 150
  noise_ramp_epochs: 0
  sigma_min: 0.0
  sigma_max: 0.0
  p_center_y: 1.0
  t_bias_pow: 1.0
  force_zero_prob: 1.0

  self_consistency_start_epoch: 9999
  w_self_consistency: 0.0

  scheduler:
    enabled: true
    type: cosine
    min_lr: 1.0e-6
