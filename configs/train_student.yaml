data:
  root: ./data/paired_uie
  patch_size: 256

model:
  base_dim: 32
  enc_blocks: [1, 1, 2, 2]
  dec_blocks: [1, 1, 1, 1]
  time_emb_dim: 256
  time_mlp_dim: 512
  use_residual_head: true
  use_gate_in_film: true

loss:
  w_recon: 1.0
  w_ssim: 0.2
  w_color: 0.1
  w_edge: 0.05
  w_freq: 0.05
  use_charbonnier: true

train:
  seed: 42
  epochs: 200
  batch_size: 8
  num_workers: 4
  lr: 0.0002
  weight_decay: 0.0001
  amp: true
  grad_clip: 1.0
  log_interval: 20
  save_dir: ./checkpoints/student

  sigma_min: 0.002
  sigma_max: 0.5
  p_center_y: 0.6
  t_bias_pow: 2.0
  force_zero_prob: 0.1

  self_consistency_start_epoch: 20
  w_self_consistency: 0.2
